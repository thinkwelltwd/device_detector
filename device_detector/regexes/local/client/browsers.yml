# Mozilla/5 (iPad; CPU OS 18 like Mac OS X) AppleWebKit/605 (KHTML, like Gecko) Mobile/15E148 [FBAB/com.itwcalculator.calculatorforipadfree]
- regex: '\[FBA[BN]/([\w\.]+\b)\]'
  name: '\g<1>'
  type: mobile app
  version: ''

# Avastium Browser - Avast browser based on Chrome
- regex: 'Avastium Chrome(?:\/(\d+[\.\d]+))'
  name: 'Avast SafeZone'
  version: '\g<1>'
  engine:
    default: 'WebKit'

- regex: 'avastium[ \/]\(?(\d+[\.\d]+)'
  name: 'Avast SafeZone'
  version: '\g<1>'
  engine:
    default: 'WebKit'

- regex: Chrome WIN (\d+[\.\d]+)
  name: Chrome
  version: '\g<1>'
  engine:
    default: 'WebKit'
